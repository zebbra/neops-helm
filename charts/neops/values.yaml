# Base values: in-cluster wiring for a release named `neops`. Every credential is
# empty here and must come from an environment values file (values-kind.yaml for KIND).
# Service names follow Helm's <release>-<chart> convention.

# Shared values for the service blocks below. A leading `_` matches no subchart name,
# so Helm ignores these keys; the aliases resolve at parse time.
_quayPullSecret: &quayPullSecret
  - name: neops-quay-registry
_coreGraphqlUrl: &coreGraphqlUrl http://neops-neops-core:8000/graphql

# Quay pull secret for the private NeOps images (rendered by templates/quay-registry-secret.yaml).
registry:
  username: ""
  password: ""

postgresql:
  enabled: true
  auth:
    username: neops
    password: ""
    database: neops
  primary:
    initdb:
      scripts:
        10-workflow-engine.sql: |
          CREATE DATABASE "neops-workflow" OWNER neops;

redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false

elasticsearch:
  enabled: true
  security:
    enabled: false
  master:
    masterOnly: false
    replicaCount: 1
    heapSize: 1g
  data:
    replicaCount: 0
  coordinating:
    replicaCount: 0
  ingest:
    replicaCount: 0

minio:
  enabled: false
  mode: standalone
  auth:
    rootUser: neops
    rootPassword: ""
  defaultBuckets: neops

neops-core:
  enabled: true
  imagePullSecrets: *quayPullSecret
  env:
    DJANGO_ALLOWED_HOSTS: "*"
    NEOPS_PLUGINS: "neops_cron neops_auth_static_api_key neops_auth_django neops_permissions_simple neops_reports"
    REDIS_URL: redis://neops-redis-master:6379/0
    ELASTICSEARCH_HOSTS: http://neops-elasticsearch:9200
    ELASTICSEARCH_DSL_INDEX_SHARDS: "1"
    ELASTICSEARCH_DSL_INDEX_REPLICAS: "0"
    ELASTICSEARCH_DSL_INDEX_FIELDS_LIMIT: "10000"
    # Core already defaults this to True; set explicitly so the compose flavour's
    # assumption is visible here rather than inherited silently.
    ELASTICSEARCH_DSL_AUTOSYNC: "True"
    DJANGO_ALLOW_ASYNC_UNSAFE: "True"
    DEBUG: "False"
  secrets:
    DJANGO_SECRET_KEY: ""
    # postgres://neops:<postgresql.auth.password>@neops-postgresql:5432/neops
    DATABASE_URL: ""

neops-workflow-engine:
  enabled: true
  imagePullSecrets: *quayPullSecret
  env:
    PORT: "3030"
    POSTGRES_HOST: neops-postgresql
    POSTGRES_PORT: "5432"
    POSTGRES_USER: neops
    NEOPS_CMS_URL: *coreGraphqlUrl
    LOG_FORMAT: json
  secrets:
    POSTGRES_PASSWORD: ""
    NEOPS_CMS_TOKEN: ""

# The workflow manager UI. ENGINE_BASE_URL is browser-facing: set it per environment.
neops-monitor-app:
  enabled: true
  imagePullSecrets: *quayPullSecret
  env:
    ENGINE_BASE_URL: ""

neops-worker:
  enabled: true
  imagePullSecrets: *quayPullSecret
  env:
    URL_BLACKBOARD: http://neops-neops-workflow-engine:3030
    WORKER_NAME: neops-worker

neops-web-client:
  enabled: true
  imagePullSecrets: *quayPullSecret
  # Browser-facing URLs: set per environment.
  env:
    FRONTEND_GRAPHQL_ENDPOINT: ""
    FRONTEND_FILEAPI_ENDPOINT: ""
    FRONTEND_WORKFLOW_MANAGER_URL: ""
    FRONTEND_DEVMODE: "false"

neops-secure-gateway:
  enabled: true
  imagePullSecrets: *quayPullSecret
  env:
    GRAPHQL_ENDPOINT_NEOPS: *coreGraphqlUrl
    PORT: "3000"
  secrets:
    SECRET_KEY: ""
    STATIC_AUTH_TOKEN: ""

neops-storage:
  enabled: false
  imagePullSecrets: *quayPullSecret
  env:
    S3_ENDPOINT: neops-minio
    S3_PORT: "9000"
    NEOPS_ENDPOINT: *coreGraphqlUrl
  secrets:
    S3_ACCESS_KEY: ""
    S3_SECRET_KEY: ""
    JWT_SIGN_KEY: ""
    ADMIN_PASSWORD_HASH: ""
