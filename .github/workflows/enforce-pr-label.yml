name: Enforce PR Label

on:
  pull_request:
    types: [opened, labeled, unlabeled, synchronize]

concurrency:
  # Scoped per PR: a repo-wide group lets two active PRs cancel each other's runs
  # of this required check, leaving both stuck on "cancelled".
  group: enforce-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enforce-label:
    # The rule is applied here rather than through zebbra/actions: that repository
    # is private, and a public repository cannot resolve an action from a private
    # one. The other neops repositories are private and keep using the shared
    # action.
    runs-on: hetzner
    steps:
      - name: Require exactly one release-note label
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          allowed="pr-breaking-change pr-new-feature pr-bugfix pr-security pr-other"
          present=$(jq -r '.[]' <<<"$LABELS" | grep -Fx -f <(tr ' ' '\n' <<<"$allowed") || true)
          count=$(printf '%s' "$present" | grep -c . || true)

          if [ "$count" -eq 1 ]; then
            echo "OK: $present"
            exit 0
          fi
          if [ "$count" -eq 0 ]; then
            echo "::error::No release-note label. Add exactly one of: $allowed"
          else
            echo "::error::$count release-note labels ($(tr '\n' ' ' <<<"$present")); exactly one is allowed."
          fi
          exit 1
